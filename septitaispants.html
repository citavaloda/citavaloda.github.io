<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Literature</title>
    <link rel="stylesheet" href="styles.css?v=1.0">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #575e69;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .module-container {
            max-width: 880px;
            width: 100%;
            background: white;
            display: inline-block;
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.1);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }



        .image-container img {
            width: 80%;
            max-width: 800px;
            height: auto;
            border-radius: 8px;
            margin: 0 auto 15px;
            display: block;
        }
        .controls button {
            margin: 5px;
            padding: 10px 15px;
            font-size: 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .controls button:hover {
            background: #ddd;
        }
        .controls button:active {
            background: #ccc;
        }
        .progress-container {
            margin: 20px 0;
            background: #ddd;
            border-radius: 4px;
            overflow: hidden;
            height: 10px;
        }
        #progress-bar {
            width: 0;
            height: 100%;
            background: #007BFF;
            transition: width 0.3s;
        }
        .back-button {
            margin-top: 20px;
            padding: 10px 20px;
            border: none;
            background: #007BFF;
            color: white;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .back-button:hover {
            background: #0056b3;
        }



    </style>

</head>
<body>
<script>
if(localStorage.getItem('cinema-mode')==='true') document.body.classList.add('cinema-mode');
</script>

<div class="app-layout">
<script>if(localStorage.getItem('sidebar-collapsed')==='true') document.querySelector('.app-layout').classList.add('sidebar-collapsed');</script>
    <aside class="sidebar">
        <!-- Injected Styles for Sidebar -->
        
    <style>
    * { box-sizing: border-box; }
    body {
        margin: 0 !important;
        padding: 0 !important;
        display: block !important;
        overflow: hidden !important; /* App layout will handle scrolling */
    }
    
    .app-layout {
        display: flex;
        height: 100vh;
        width: 100vw;
        background-color: #575e69;
        font-family: 'Inter', Arial, sans-serif;
    }
    
    .sidebar {
        width: 340px;
        flex-shrink: 0;
        background-color: #ffffff;
        overflow-y: auto;
        padding: 20px;
        box-shadow: 2px 0 15px rgba(0, 0, 0, 0.15);
        z-index: 10;
    }
    
    .main-content {
        flex: 1;
        overflow-y: auto;
        position: relative;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 40px 20px;
    }
    
    /* Menu Styles Extracted */
    .satura-content {
        display: flex;
        flex-direction: column;
        gap: 0;
    }

    .satura-page {
        width: 100%;
    }

    .dropdown {
        background-color: #ffffff;
        border-radius: 8px;
    }

    .dropdown summary {
        list-style: none;
        cursor: pointer;
        outline: none;
    }

    .dropdown summary::-webkit-details-marker {
        display: none;
    }

    .dropdown > summary h2 {
        font-size: 1rem;
        color: #444;
        margin: 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 0;
        border-bottom: 1px solid #eaeaea;
        transition: color 0.3s;
    }

    .dropdown > summary h2:hover {
        color: #007bff;
    }

    .dropdown > summary h2::after {
        content: '►';
        font-size: 1rem;
        transition: transform 0.3s ease;
        color: #777;
    }

    .dropdown[open] > summary h2::after {
        transform: rotate(90deg);
    }

    .dropdown-content {
        padding-top: 15px;
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .dropdown-content a {
        display: block;
        font-size: 1rem;
        color: #007bff;
        text-decoration: none;
        background-color: #f9f9f9;
        padding: 10px 15px;
        border-radius: 6px;
        transition: background-color 0.3s, color 0.3s, transform 0.2s;
    }

    .dropdown-content a:hover {
        background-color: #007bff;
        color: #ffffff;
        transform: translateX(4px);
    }
    
    .dropdown-content a.active {
        background-color: #007bff;
        color: #ffffff;
        font-weight: bold;
    }

    .sub-dropdown {
        margin-bottom: 8px;
        box-shadow: none;
        border: none;
        padding: 0;
    }

    .sub-dropdown > summary h2 {
        color: #007bff;
        background-color: #f9f9f9;
        padding: 10px 15px;
        border-radius: 6px;
        border-bottom: none;
        transition: background-color 0.3s, color 0.3s, transform 0.2s;
    }

    .sub-dropdown > summary:hover h2 {
        background-color: #007bff;
        color: #ffffff;
        transform: translateX(4px);
    }

    .sub-dropdown > summary h2::after {
        color: #007bff;
    }
    
    .sub-dropdown > summary:hover h2::after {
        color: #ffffff;
    }
    
    
    /* Floating Action Buttons */
    .fab-container {
        position: fixed;
        z-index: 1000;
        display: flex;
        gap: 15px;
    }
    .fab-container.top-right {
        top: 20px;
        right: 20px;
    }
    .fab-container.top-left {
        top: 20px;
        left: 360px; /* Right next to sidebar */
        transition: left 0.3s ease;
    }
    .app-layout.sidebar-collapsed .fab-container.top-left {
        left: 20px;
    }
    .fab-button {
        background-color: rgba(255, 255, 255, 0.9);
        border: 1px solid #ddd;
        border-radius: 50%;
        width: 45px;
        height: 45px;
        font-size: 20px;
        cursor: pointer;
        box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        display: flex;
        justify-content: center;
        align-items: center;
        transition: all 0.3s ease;
        outline: none;
    }
    .fab-button:hover {
        background-color: #fff;
        transform: scale(1.1);
        box-shadow: 0 6px 15px rgba(0,0,0,0.2);
    }
    
    /* Sidebar Toggle Logic */
    .sidebar {
        transition: transform 0.3s ease, margin-left 0.3s ease;
    }
    .app-layout.sidebar-collapsed .sidebar {
        margin-left: -340px;
    }
    @media screen and (max-width: 900px) {
        .fab-container.top-left {
            left: 20px !important; /* On mobile it's always on left */
            top: 20px;
        }
        .app-layout.sidebar-collapsed .sidebar {
            margin-left: 0;
            margin-top: -100vh;
            display: none; 
        }
    }
    
    /* Cinema Mode Logic */
    body.cinema-mode .app-layout {
        background-color: #111 !important;
    }
    body.cinema-mode .sidebar {
        background-color: #1a1a1a !important;
        box-shadow: none !important;
        border-right: 1px solid #333;
    }
    body.cinema-mode .sidebar * {
        color: #888 !important;
        border-color: #333 !important;
    }
    body.cinema-mode .sidebar .dropdown-content a:hover,
    body.cinema-mode .sidebar .dropdown-content a.active {
        background-color: #333 !important;
        color: #ddd !important;
    }
    body.cinema-mode .sidebar .dropdown-content a,
    body.cinema-mode .sidebar .sub-dropdown > summary h2 {
        background-color: #222 !important;
    }
    
    /* Fixed Sidebar Colors */
    body.cinema-mode .sidebar .dropdown {
        background-color: transparent !important;
    }
    body.cinema-mode .sidebar .dropdown > summary h2 {
        background-color: #1a1a1a !important;
        border-color: #333 !important;
    }
    body.cinema-mode .fab-button {
        background-color: #333;
        color: #eee;
        border-color: #555;
    }
    body.cinema-mode .fab-button:hover {
        background-color: #444;
    }
    
    /* Extra specific resets for cinema mode */
    body.cinema-mode .sidebar .dropdown > summary h2 {
        background-color: transparent !important;
    }

    /* Mobile responsive */
    @media screen and (max-width: 900px) {
        .app-layout {
            flex-direction: column;
        }
        .sidebar {
            width: 100%;
            height: auto;
            max-height: 50vh;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .main-content {
            padding: 20px 10px;
        }
    }
    </style>

        <!-- Injected Sidebar Menu -->
        <div style="margin-bottom: 20px;">
            <button class="back-button" onclick="window.location.href='index.html'" style="width: 100%; text-align: center; margin-top: 0; align-self: auto;">Atpakaļ uz paneli</button>
        </div>

        <div id="sidebar-menu-container"></div>
    </aside>
    <main class="main-content">

    <!-- Floating Action Buttons -->
    <div class="fab-container top-left">
        <button id="sidebar-toggle" class="fab-button" title="Rādīt/Slēpt izvēlni">☰</button>
    </div>
    <div class="fab-container top-right">
        <button id="cinema-toggle" class="fab-button" title="Izslēgt/Ieslēgt gaismu">💡</button>
    </div>

        
<div class="module-container">
    <div class="image-container">
        <img id="word-image" src="images/seklamaza.png" alt="Word Image">
    </div>
    <div class="text-container">
        <p id="word-text">Sēkla mazā,</p>
    </div>
    <audio id="word-audio"  autoplay></audio>
    <div class="controls">
        <button id="start-button">&#9658;</button>
        <button id="stop-button">&#10074;&#10074;</button>
        <button id="replay-button">&#x21bb;</button>
        <button id="slide-left-button">&#9665;</button>
        <button id="slide-right-button">&#9655;</button>
        <button id="mute-button">🔈</button>
    </div>
    <div class="progress-container">
        <div id="progress-bar"></div>
    </div>
    </div>

<script>
const sentences = [
    {
        sentence: "Sēkla mazā, Saujā nāc, Zemē melnā Gulēt sāc! Saule,lietus palīdzēs, Sēklai asnu izaudzēs!",
        words: [
            { word: "Sēkla mazā,", image: "images/seklamaza.png", audio: "audio/seklamaza.wav" },
            { word: "Saujā nāc,", image: "images/saujanac.png", audio: "audio/saujanac.wav" },
            { word: "Zemē melnā gulēt sāc!", image: "images/zemegulet.png", audio: "audio/zemegulet.wav" },
            { word: "Saule,lietus palīdzēs,", image: "images/saulelietus.png", audio: "audio/saulelietus.wav" },
            { word: "Sēklai asnu izaudzēs!", image: "images/seklaiasnu.png", audio: "audio/seklaiasnu.wav" },
        ]
    }
];

let currentSentenceIndex = 0;
let currentWordIndex = 0;
let intervalId = null;
let isMuted = false;

const imageElement = document.getElementById('word-image');
const textElement = document.getElementById('word-text');
const audioElement = document.getElementById('word-audio');
const muteButton = document.getElementById('mute-button');
const progressBar = document.getElementById('progress-bar');

const duration = 4000; // 4 seconds per word

function updateProgressBar(sentenceIndex, wordIndex) {
    const sentence = sentences[sentenceIndex];
    const progressPercentage = ((wordIndex + 1) / sentence.words.length) * 100;
    progressBar.style.width = `${progressPercentage}%`;
}

// --- Core update function ---
function updateWord(sentenceIndex, wordIndex, playAudio = true) {
    const word = sentences[sentenceIndex].words[wordIndex];

    imageElement.classList.remove('show');
    textElement.classList.remove('show');

    setTimeout(() => {
        imageElement.src = word.image;
        textElement.textContent = word.word;

        if (playAudio) {
            audioElement.src = word.audio;
            if (!isMuted) {
                audioElement.play();
            }
        } else {
            // ensure audio is stopped when sliding
            audioElement.pause();
            audioElement.currentTime = 0;
        }

        imageElement.classList.add('show');
        textElement.classList.add('show');
    }, 300);

    updateProgressBar(sentenceIndex, wordIndex);
}

function nextWord(playAudio = true) {
    currentWordIndex++;
    if (currentWordIndex >= sentences[currentSentenceIndex].words.length) {
        currentWordIndex = 0;
        currentSentenceIndex = (currentSentenceIndex + 1) % sentences.length;
    }
    updateWord(currentSentenceIndex, currentWordIndex, playAudio);
}

function previousWord(playAudio = true) {
    currentWordIndex--;
    if (currentWordIndex < 0) {
        currentSentenceIndex = (currentSentenceIndex - 1 + sentences.length) % sentences.length;
        currentWordIndex = sentences[currentSentenceIndex].words.length - 1;
    }
    updateWord(currentSentenceIndex, currentWordIndex, playAudio);
}

// Stop everything
function stopAll() {
    if (intervalId) {
        clearInterval(intervalId);
        intervalId = null;
    }
    audioElement.pause();
    audioElement.currentTime = 0;
}

// --- Buttons ---

// Start slideshow with audio
document.getElementById('start-button').addEventListener('click', () => {
    if (!intervalId) {
        updateWord(currentSentenceIndex, currentWordIndex, true);
        intervalId = setInterval(() => nextWord(true), duration);
    }
});

// Replay slideshow from beginning with audio
document.getElementById('replay-button').addEventListener('click', () => {
    stopAll();
    currentSentenceIndex = 0;
    currentWordIndex = 0;
    updateWord(currentSentenceIndex, currentWordIndex, true);
    intervalId = setInterval(() => nextWord(true), duration);
});

// Skip left → stop audio, slide picture only
document.getElementById('slide-left-button').addEventListener('click', () => {
    if (intervalId) {
        clearInterval(intervalId);
        intervalId = null;
    }
    previousWord(false);
});

// Skip right → stop audio, slide picture only
document.getElementById('slide-right-button').addEventListener('click', () => {
    if (intervalId) {
        clearInterval(intervalId);
        intervalId = null;
    }
    nextWord(false);
});

// Stop → kill slideshow + audio
document.getElementById('stop-button').addEventListener('click', () => {
    stopAll();
});

// Mute button
muteButton.addEventListener('click', () => {
    isMuted = !isMuted;
    muteButton.textContent = isMuted ? '🔇' : '🔈';
    if (isMuted) {
        audioElement.pause();
    }
});

// Prevent audio if muted
audioElement.addEventListener('play', () => {
    if (isMuted) {
        audioElement.pause();
    }
});
</script>

    </main>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
    const currentPath = window.location.pathname.split('/').pop();
    if (!currentPath) return; // on root folder
    
    const links = document.querySelectorAll('.sidebar .satura-content a');
    links.forEach(link => {
        const href = link.getAttribute('href');
        if (href && href === currentPath) {
            link.classList.add('active');
            // Auto open parent details
            let parent = link.closest('details');
            while (parent) {
                parent.open = true;
                parent = parent.parentElement.closest('details');
            }
            // Scroll sidebar to the active link
            link.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
    });
});
</script>


<script>
document.addEventListener("DOMContentLoaded", () => {
    const sidebarToggle = document.getElementById('sidebar-toggle');
    const cinemaToggle = document.getElementById('cinema-toggle');
    const appLayout = document.querySelector('.app-layout');
    const body = document.body;

    // Load saved preferences
    if (localStorage.getItem('sidebar-collapsed') === 'true') {
        appLayout.classList.add('sidebar-collapsed');
    }
    if (localStorage.getItem('cinema-mode') === 'true') {
        body.classList.add('cinema-mode');
        cinemaToggle.textContent = '☀️';
    }

    // Toggle Sidebar
    if (sidebarToggle) {
        sidebarToggle.addEventListener('click', () => {
            appLayout.classList.toggle('sidebar-collapsed');
            localStorage.setItem('sidebar-collapsed', appLayout.classList.contains('sidebar-collapsed'));
        });
    }

    // Toggle Cinema Mode
    if (cinemaToggle) {
        cinemaToggle.addEventListener('click', () => {
            body.classList.toggle('cinema-mode');
            const isCinema = body.classList.contains('cinema-mode');
            localStorage.setItem('cinema-mode', isCinema);
            cinemaToggle.textContent = isCinema ? '☀️' : '💡';
        });
    }
});
</script>

<script src="menu.js"></script>
</body>
