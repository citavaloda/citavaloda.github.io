<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4. Leļļu veļas diena</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
    body {
        font-family: 'Inter', Arial, sans-serif;
        background-color: #575e69;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 20px;
        box-sizing: border-box;
    }

    .container {
        display: flex;
        flex-direction: column;
        align-items: center;
        background-color: #ffffff;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        width: 100%;
        max-width: 1000px;
        box-sizing: border-box;
    }

    #title {
        text-align: center;
        width: 100%;
        margin-bottom: 20px;
    }

    #title h2 {
        margin: 0;
        color: #333333;
        font-size: 2.2rem;
        font-weight: 700;
    }

    video {
        width: 100%;
        height: auto;
        border-radius: 8px;
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.15);
        background-color: #000;
    }

    .back-button {
        margin-top: 25px;
        padding: 12px 24px;
        background-color: #007bff;
        color: white;
        font-size: 18px;
        border: none;
        font-weight: 600;
        border-radius: 8px;
        cursor: pointer;
        box-shadow: 0 4px 6px rgba(0, 123, 255, 0.2);
        transition: background-color 0.3s, transform 0.2s, box-shadow 0.2s;
        align-self: flex-end;
    }

    .back-button:hover {
        background-color: #0056b3;
        transform: translateY(-2px);
        box-shadow: 0 6px 12px rgba(0, 123, 255, 0.3);
    }

    @media screen and (max-width: 768px) {
        #title h2 {
            font-size: 1.5rem;
        }
        
        .container {
            padding: 15px;
        }
        
        .back-button {
            font-size: 16px;
            padding: 10px 20px;
        }
    }
    </style>
</head>
<body>
<script>
if(localStorage.getItem('cinema-mode')==='true') document.body.classList.add('cinema-mode');
</script>

<div class="app-layout">
<script>if(localStorage.getItem('sidebar-collapsed')==='true') document.querySelector('.app-layout').classList.add('sidebar-collapsed');</script>
    <aside class="sidebar">
        <!-- Injected Styles for Sidebar -->
        
    <style>
    * { box-sizing: border-box; }
    body {
        margin: 0 !important;
        padding: 0 !important;
        display: block !important;
        overflow: hidden !important; /* App layout will handle scrolling */
    }
    
    .app-layout {
        display: flex;
        height: 100vh;
        width: 100vw;
        background-color: #575e69;
        font-family: 'Inter', Arial, sans-serif;
    }
    
    .sidebar {
        width: 340px;
        flex-shrink: 0;
        background-color: #ffffff;
        overflow-y: auto;
        padding: 20px;
        box-shadow: 2px 0 15px rgba(0, 0, 0, 0.15);
        z-index: 10;
    }
    
    .main-content {
        flex: 1;
        overflow-y: auto;
        position: relative;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 40px 20px;
    }
    
    /* Menu Styles Extracted */
    .satura-content {
        display: flex;
        flex-direction: column;
        gap: 0;
    }

    .satura-page {
        width: 100%;
    }

    .dropdown {
        background-color: #ffffff;
        border-radius: 8px;
    }

    .dropdown summary {
        list-style: none;
        cursor: pointer;
        outline: none;
    }

    .dropdown summary::-webkit-details-marker {
        display: none;
    }

    .dropdown > summary h2 {
        font-size: 1rem;
        color: #444;
        margin: 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 0;
        border-bottom: 1px solid #eaeaea;
        transition: color 0.3s;
    }

    .dropdown > summary h2:hover {
        color: #007bff;
    }

    .dropdown > summary h2::after {
        content: '►';
        font-size: 1rem;
        transition: transform 0.3s ease;
        color: #777;
    }

    .dropdown[open] > summary h2::after {
        transform: rotate(90deg);
    }

    .dropdown-content {
        padding-top: 15px;
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .dropdown-content a {
        display: block;
        font-size: 1rem;
        color: #007bff;
        text-decoration: none;
        background-color: #f9f9f9;
        padding: 10px 15px;
        border-radius: 6px;
        transition: background-color 0.3s, color 0.3s, transform 0.2s;
    }

    .dropdown-content a:hover {
        background-color: #007bff;
        color: #ffffff;
        transform: translateX(4px);
    }
    
    .dropdown-content a.active {
        background-color: #007bff;
        color: #ffffff;
        font-weight: bold;
    }

    .sub-dropdown {
        margin-bottom: 8px;
        box-shadow: none;
        border: none;
        padding: 0;
    }

    .sub-dropdown > summary h2 {
        color: #007bff;
        background-color: #f9f9f9;
        padding: 10px 15px;
        border-radius: 6px;
        border-bottom: none;
        transition: background-color 0.3s, color 0.3s, transform 0.2s;
    }

    .sub-dropdown > summary:hover h2 {
        background-color: #007bff;
        color: #ffffff;
        transform: translateX(4px);
    }

    .sub-dropdown > summary h2::after {
        color: #007bff;
    }
    
    .sub-dropdown > summary:hover h2::after {
        color: #ffffff;
    }
    
    
    /* Floating Action Buttons */
    .fab-container {
        position: fixed;
        z-index: 1000;
        display: flex;
        gap: 15px;
    }
    .fab-container.top-right {
        top: 20px;
        right: 20px;
    }
    .fab-container.top-left {
        top: 20px;
        left: 360px; /* Right next to sidebar */
        transition: left 0.3s ease;
    }
    .app-layout.sidebar-collapsed .fab-container.top-left {
        left: 20px;
    }
    .fab-button {
        background-color: rgba(255, 255, 255, 0.9);
        border: 1px solid #ddd;
        border-radius: 50%;
        width: 45px;
        height: 45px;
        font-size: 20px;
        cursor: pointer;
        box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        display: flex;
        justify-content: center;
        align-items: center;
        transition: all 0.3s ease;
        outline: none;
    }
    .fab-button:hover {
        background-color: #fff;
        transform: scale(1.1);
        box-shadow: 0 6px 15px rgba(0,0,0,0.2);
    }
    
    /* Sidebar Toggle Logic */
    .sidebar {
        transition: transform 0.3s ease, margin-left 0.3s ease;
    }
    .app-layout.sidebar-collapsed .sidebar {
        margin-left: -340px;
    }
    @media screen and (max-width: 900px) {
        .fab-container.top-left {
            left: 20px !important; /* On mobile it's always on left */
            top: 20px;
        }
        .app-layout.sidebar-collapsed .sidebar {
            margin-left: 0;
            margin-top: -100vh;
            display: none; 
        }
    }
    
    /* Cinema Mode Logic */
    body.cinema-mode .app-layout {
        background-color: #111 !important;
    }
    body.cinema-mode .sidebar {
        background-color: #1a1a1a !important;
        box-shadow: none !important;
        border-right: 1px solid #333;
    }
    body.cinema-mode .sidebar * {
        color: #888 !important;
        border-color: #333 !important;
    }
    body.cinema-mode .sidebar .dropdown-content a:hover,
    body.cinema-mode .sidebar .dropdown-content a.active {
        background-color: #333 !important;
        color: #ddd !important;
    }
    body.cinema-mode .sidebar .dropdown-content a,
    body.cinema-mode .sidebar .sub-dropdown > summary h2 {
        background-color: #222 !important;
    }
    
    /* Fixed Sidebar Colors */
    body.cinema-mode .sidebar .dropdown {
        background-color: transparent !important;
    }
    body.cinema-mode .sidebar .dropdown > summary h2 {
        background-color: #1a1a1a !important;
        border-color: #333 !important;
    }
    body.cinema-mode .fab-button {
        background-color: #333;
        color: #eee;
        border-color: #555;
    }
    body.cinema-mode .fab-button:hover {
        background-color: #444;
    }
    
    /* Extra specific resets for cinema mode */
    body.cinema-mode .sidebar .dropdown > summary h2 {
        background-color: transparent !important;
    }

    /* Mobile responsive */
    @media screen and (max-width: 900px) {
        .app-layout {
            flex-direction: column;
        }
        .sidebar {
            width: 100%;
            height: auto;
            max-height: 50vh;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .main-content {
            padding: 20px 10px;
        }
    }
    </style>

        <!-- Injected Sidebar Menu -->
        <div style="margin-bottom: 20px;">
            <button class="back-button" onclick="window.location.href='index.html'" style="width: 100%; text-align: center; margin-top: 0; align-self: auto;">Atpakaļ uz paneli</button>
        </div>

        <div id="sidebar-menu-container"></div>
    </aside>
    <main class="main-content">

    <!-- Floating Action Buttons -->
    <div class="fab-container top-left">
        <button id="sidebar-toggle" class="fab-button" title="Rādīt/Slēpt izvēlni">☰</button>
    </div>
    <div class="fab-container top-right">
        <button id="cinema-toggle" class="fab-button" title="Izslēgt/Ieslēgt gaismu">💡</button>
    </div>

        
<div class="container">
    <div id="title"><h2>4. Leļļu veļas diena</h2></div>
    <video src="video/Rainis/Le%C4%BC%C4%BCu%20ve%C4%BCas%20diena.mp4" controls></video>
    
</div>

    </main>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
    const currentPath = window.location.pathname.split('/').pop();
    if (!currentPath) return; // on root folder
    
    const links = document.querySelectorAll('.sidebar .satura-content a');
    links.forEach(link => {
        const href = link.getAttribute('href');
        if (href && href === currentPath) {
            link.classList.add('active');
            // Auto open parent details
            let parent = link.closest('details');
            while (parent) {
                parent.open = true;
                parent = parent.parentElement.closest('details');
            }
            // Scroll sidebar to the active link
            link.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
    });
});
</script>


<script>
document.addEventListener("DOMContentLoaded", () => {
    const sidebarToggle = document.getElementById('sidebar-toggle');
    const cinemaToggle = document.getElementById('cinema-toggle');
    const appLayout = document.querySelector('.app-layout');
    const body = document.body;

    // Load saved preferences
    if (localStorage.getItem('sidebar-collapsed') === 'true') {
        appLayout.classList.add('sidebar-collapsed');
    }
    if (localStorage.getItem('cinema-mode') === 'true') {
        body.classList.add('cinema-mode');
        cinemaToggle.textContent = '☀️';
    }

    // Toggle Sidebar
    if (sidebarToggle) {
        sidebarToggle.addEventListener('click', () => {
            appLayout.classList.toggle('sidebar-collapsed');
            localStorage.setItem('sidebar-collapsed', appLayout.classList.contains('sidebar-collapsed'));
        });
    }

    // Toggle Cinema Mode
    if (cinemaToggle) {
        cinemaToggle.addEventListener('click', () => {
            body.classList.toggle('cinema-mode');
            const isCinema = body.classList.contains('cinema-mode');
            localStorage.setItem('cinema-mode', isCinema);
            cinemaToggle.textContent = isCinema ? '☀️' : '💡';
        });
    }
});
</script>

<script src="menu.js"></script>
</body>
</html>
