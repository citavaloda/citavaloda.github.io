<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vārdnīca</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
    body {
        font-family: 'Inter', Arial, sans-serif;
        background-color: #575e69;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        flex-direction: column;
        position: relative;
    }

    .alphabet-container {
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        gap: 10px;
        background-color: #ffffff;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
        position: relative;
        width: 100%;
        max-width: 980pt;
        padding-bottom: 50px;
    }

    .letter-box {
        width: 100%;
        aspect-ratio: 1 / 1;
        background-color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 4rem;
        font-weight: bold;
        color: #333;
        border-radius: 8px;
        cursor: pointer;
        transition: background-color 0.3s, transform 0.2s;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        position: relative;
        overflow: hidden;
    }

    .letter-box:hover {
        background-color: #007bff;
        color: #ffffff;
        transform: translateY(-5px) scale(1.02);
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
    }

    /* CENTRĒŠANAS LABOJUMI UZNIRSTOŠAJĀ LOGĀ UN ATTĒLAM */
.popup {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: #fff;
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        padding: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: transform 0.3s ease;
        z-index: 10;
        box-sizing: border-box;
        
        /* Izmēru maiņas punkts tieši centrā un sākuma mērogs 0 */
        transform-origin: center center;
        transform: scale(0);
    }



    .popup img {
        max-width: 100%;
        max-height: 100%;
        width: auto;
        height: auto;
        object-fit: contain; /* Nodrošina pilnu attēla redzamību un proporcionalitāti centriņā */
        display: block;
        margin: auto;
        border-radius: 6px;
    }

    .letter-box.active .popup {
        /* Pilnībā nosedz kārtiņu bez nobīdēm */
        transform: scale(1);
    }

    .back-button {
        position: absolute;
        bottom: 10px;
        right: 10px;
        padding: 10px 20px;
        background-color: #007bff;
        color: white;
        font-size: 18px;
        border: none;
        font-weight: bold;
        border-radius: 8px;
        cursor: pointer;
        z-index: 10;
        box-shadow: 0 4px 6px rgba(0, 123, 255, 0.2);
        transition: background-color 0.3s, transform 0.2s, box-shadow 0.2s;
    }

    .back-button:hover {
        background-color: #0056b3;
        transform: translateY(-2px);
        box-shadow: 0 6px 12px rgba(0, 123, 255, 0.3);
    }

    /* Responsive Styles */
    @media screen and (max-width: 768px) {
        .alphabet-container {
            grid-template-columns: repeat(4, 1fr);
            padding-bottom: 70px;
        }
        .letter-box {
            font-size: 3rem;
        }
        .back-button {
            font-size: 16px;
            padding: 8px 16px;
        }
    }

    @media screen and (max-width: 480px) {
        .alphabet-container {
            grid-template-columns: repeat(3, 1fr);
            padding-bottom: 80px;
        }
        .letter-box {
            font-size: 2.5rem;
        }
        .back-button {
            font-size: 14px;
            padding: 6px 12px;
        }
    }
    </style>
</head>
<body>
<script>
if(localStorage.getItem('cinema-mode')==='true') document.body.classList.add('cinema-mode');
</script>

<div class="app-layout">
<script>if(localStorage.getItem('sidebar-collapsed')==='true') document.querySelector('.app-layout').classList.add('sidebar-collapsed');</script>
    <aside class="sidebar">
        <!-- Injected Styles for Sidebar -->
        <style>
        * { box-sizing: border-box; }
        body {
            margin: 0 !important;
            padding: 0 !important;
            display: block !important;
            overflow: hidden !important;
        }
        
        .app-layout {
            display: flex;
            height: 100vh;
            width: 100vw;
            background-color: #575e69;
            font-family: 'Inter', Arial, sans-serif;
        }
        
        .sidebar {
            width: 340px;
            flex-shrink: 0;
            background-color: #ffffff;
            overflow-y: auto;
            padding: 20px;
            box-shadow: 2px 0 15px rgba(0, 0, 0, 0.15);
            z-index: 10;
        }
        
        .main-content {
            flex: 1;
            overflow-y: auto;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px 20px;
        }
        
        /* Menu Styles Extracted */
        .satura-content {
            display: flex;
            flex-direction: column;
            gap: 0;
        }

        .satura-page {
            width: 100%;
        }

        .dropdown {
            background-color: #ffffff;
            border-radius: 8px;
        }

        .dropdown summary {
            list-style: none;
            cursor: pointer;
            outline: none;
        }

        .dropdown summary::-webkit-details-marker {
            display: none;
        }

        .dropdown > summary h2 {
            font-size: 1rem;
            color: #444;
            margin: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #eaeaea;
            transition: color 0.3s;
        }

        .dropdown > summary h2:hover {
            color: #007bff;
        }

        .dropdown > summary h2::after {
            content: '►';
            font-size: 1rem;
            transition: transform 0.3s ease;
            color: #777;
        }

        .dropdown[open] > summary h2::after {
            transform: rotate(90deg);
        }

        .dropdown-content {
            padding-top: 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .dropdown-content a {
            display: block;
            font-size: 1rem;
            color: #007bff;
            text-decoration: none;
            background-color: #f9f9f9;
            padding: 10px 15px;
            border-radius: 6px;
            transition: background-color 0.3s, color 0.3s, transform 0.2s;
        }

        .dropdown-content a:hover {
            background-color: #007bff;
            color: #ffffff;
            transform: translateX(4px);
        }
        
        .dropdown-content a.active {
            background-color: #007bff;
            color: #ffffff;
            font-weight: bold;
        }

        .sub-dropdown {
            margin-bottom: 8px;
            box-shadow: none;
            border: none;
            padding: 0;
        }

        .sub-dropdown > summary h2 {
            color: #007bff;
            background-color: #f9f9f9;
            padding: 10px 15px;
            border-radius: 6px;
            border-bottom: none;
            transition: background-color 0.3s, color 0.3s, transform 0.2s;
        }

        .sub-dropdown > summary:hover h2 {
            background-color: #007bff;
            color: #ffffff;
            transform: translateX(4px);
        }

        .sub-dropdown > summary h2::after {
            color: #007bff;
        }
        
        .sub-dropdown > summary:hover h2::after {
            color: #ffffff;
        }
        
        /* Floating Action Buttons */
        .fab-container {
            position: fixed;
            z-index: 1000;
            display: flex;
            gap: 15px;
        }
        .fab-container.top-right {
            top: 20px;
            right: 20px;
        }
        .fab-container.top-left {
            top: 20px;
            left: 360px;
            transition: left 0.3s ease;
        }
        .app-layout.sidebar-collapsed .fab-container.top-left {
            left: 20px;
        }
        .fab-button {
            background-color: rgba(255, 255, 255, 0.9);
            border: 1px solid #ddd;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            font-size: 20px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
            outline: none;
        }
        .fab-button:hover {
            background-color: #fff;
            transform: scale(1.1);
            box-shadow: 0 6px 15px rgba(0,0,0,0.2);
        }
        
        /* Sidebar Toggle Logic */
        .sidebar {
            transition: transform 0.3s ease, margin-left 0.3s ease;
        }
        .app-layout.sidebar-collapsed .sidebar {
            margin-left: -340px;
        }
        @media screen and (max-width: 900px) {
            .fab-container.top-left {
                left: 20px !important;
                top: 20px;
            }
            .app-layout.sidebar-collapsed .sidebar {
                margin-left: 0;
                margin-top: -100vh;
                display: none; 
            }
        }
        
        /* Cinema Mode Logic */
        body.cinema-mode .app-layout {
            background-color: #111 !important;
        }
        body.cinema-mode .sidebar {
            background-color: #1a1a1a !important;
            box-shadow: none !important;
            border-right: 1px solid #333;
        }
        body.cinema-mode .sidebar * {
            color: #888 !important;
            border-color: #333 !important;
        }
        body.cinema-mode .sidebar .dropdown-content a:hover,
        body.cinema-mode .sidebar .dropdown-content a.active {
            background-color: #333 !important;
            color: #ddd !important;
        }
        body.cinema-mode .sidebar .dropdown-content a,
        body.cinema-mode .sidebar .sub-dropdown > summary h2 {
            background-color: #222 !important;
        }
        
        body.cinema-mode .sidebar .dropdown {
            background-color: transparent !important;
        }
        body.cinema-mode .sidebar .dropdown > summary h2 {
            background-color: #1a1a1a !important;
            border-color: #333 !important;
        }
        body.cinema-mode .fab-button {
            background-color: #333;
            color: #eee;
            border-color: #555;
        }
        body.cinema-mode .fab-button:hover {
            background-color: #444;
        }
        
        body.cinema-mode .sidebar .dropdown > summary h2 {
            background-color: transparent !important;
        }

        @media screen and (max-width: 900px) {
            .app-layout {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
                height: auto;
                max-height: 50vh;
                box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            }
            .main-content {
                padding: 20px 10px;
            }
        }
        </style>

        <div style="margin-bottom: 20px;">
            <button class="back-button" onclick="window.location.href='index.html'" style="width: 100%; text-align: center; margin-top: 0; align-self: auto;">Atpakaļ uz paneli</button>
        </div>

        <div id="sidebar-menu-container"></div>
    </aside>

    <main class="main-content">
        <!-- Floating Action Buttons -->
        <div class="fab-container top-left">
            <button id="sidebar-toggle" class="fab-button" title="Rādīt/Slēpt izvēlni">☰</button>
        </div>
        <div class="fab-container top-right">
            <button id="cinema-toggle" class="fab-button" title="Izslēgt/Ieslēgt gaismu">💡</button>
        </div>

        <div class="alphabet-container" id="alphabetBox">
        </div>

        <script>
            const alphabet = ["A", "Ā", "B", "C", "Č", "D", "E", "Ē", "F", "G", "Ģ", "H", "I", "Ī", "J", "K", "Ķ", "L", "Ļ", "M", "N", "Ņ", "O", "P", "R", "S", "Š", "T", "U", "Ū", "V", "Z", "Ž"];
            const alphabetBox = document.getElementById("alphabetBox");

            alphabet.forEach(letter => {
                const box = document.createElement("div");
                box.classList.add("letter-box");
                box.textContent = letter;

                const popup = document.createElement("div");
                popup.classList.add("popup");
                const img = document.createElement("img");
                img.src = `images/${letter}.png`;
                popup.appendChild(img);

                box.appendChild(popup);

                const audio = document.createElement("audio");
                audio.src = `audio/${letter}.wav`;
                audio.preload = "auto";

                box.appendChild(audio);

                box.addEventListener("mouseenter", () => {
                    audio.play();
                });

                box.addEventListener("click", () => {
                    if (box.classList.contains("active")) {
                        box.classList.remove("active");
                    } else {
                        document.querySelectorAll(".letter-box").forEach(b => b.classList.remove("active"));
                        box.classList.add("active");
                    }
                });

                alphabetBox.appendChild(box);
            });
        </script>
    </main>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
    const currentPath = window.location.pathname.split('/').pop();
    if (!currentPath) return;
    
    const links = document.querySelectorAll('.sidebar .satura-content a');
    links.forEach(link => {
        const href = link.getAttribute('href');
        if (href && href === currentPath) {
            link.classList.add('active');
            let parent = link.closest('details');
            while (parent) {
                parent.open = true;
                parent = parent.parentElement.closest('details');
            }
            link.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
    });
});
</script>

<script>
document.addEventListener("DOMContentLoaded", () => {
    const sidebarToggle = document.getElementById('sidebar-toggle');
    const cinemaToggle = document.getElementById('cinema-toggle');
    const appLayout = document.querySelector('.app-layout');
    const body = document.body;

    if (localStorage.getItem('sidebar-collapsed') === 'true') {
        appLayout.classList.add('sidebar-collapsed');
    }
    if (localStorage.getItem('cinema-mode') === 'true') {
        body.classList.add('cinema-mode');
        cinemaToggle.textContent = '☀️';
    }

    if (sidebarToggle) {
        sidebarToggle.addEventListener('click', () => {
            appLayout.classList.toggle('sidebar-collapsed');
            localStorage.setItem('sidebar-collapsed', appLayout.classList.contains('sidebar-collapsed'));
        });
    }

    if (cinemaToggle) {
        cinemaToggle.addEventListener('click', () => {
            body.classList.toggle('cinema-mode');
            const isCinema = body.classList.contains('cinema-mode');
            localStorage.setItem('cinema-mode', isCinema);
            cinemaToggle.textContent = isCinema ? '☀️' : '💡';
        });
    }
});
</script>

<script src="menu.js"></script>
</body>
</html>
