<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vārdnīca</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
    body {
        font-family: 'Inter', Arial, sans-serif;
        background-color: #575e69;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        flex-direction: column;
        position: relative; /* Added to fix button position */
    }

    .alphabet-container {
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        gap: 10px;
        background-color: #ffffff;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
        position: relative; /* This will be the reference for the button's positioning */
        width: 100%;
        max-width: 980pt;
        padding-bottom: 50px; /* Added padding to ensure button is not covered */
    }

    .letter-box {
        width: 100%;
        aspect-ratio: 1 / 1;
        background-color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 4rem;
        font-weight: bold;
        color: #333;
        border-radius: 8px;
        cursor: pointer;
        transition: background-color 0.3s, transform 0.2s;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        position: relative;
        overflow: hidden;
    }

    .letter-box:hover {
        background-color: #007bff;
        color: #ffffff;
        transform: translateY(-5px) scale(1.02);
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
    }

    .popup {
        position: absolute;
        top: 0;
        left: 50%;
        transform: translateX(-50%) scale(0);
        width: 100%;
        height: 100%;
        background-color: #fff;
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        padding: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: transform 0.3s;
    }

    .popup img {
        max-width: 100%;
        max-height: 100%;
        object-fit: cover;
        border-radius: 6px;
    }

    .letter-box.active .popup {
        transform: scale(1);
    }

    .back-button {
        position: absolute;
        bottom: 10px;
        right: 10px;
        padding: 10px 20px;
        background-color: #007bff;
        color: white;
        font-size: 18px;
        border: none;
        font-weight: bold;
        border-radius: 8px;
        cursor: pointer;
        z-index: 10;
        box-shadow: 0 4px 6px rgba(0, 123, 255, 0.2);
        transition: background-color 0.3s, transform 0.2s, box-shadow 0.2s;
    }

    .back-button:hover {
        background-color: #0056b3;
        transform: translateY(-2px);
        box-shadow: 0 6px 12px rgba(0, 123, 255, 0.3);
    }

    /* Responsive Styles */
    @media screen and (max-width: 768px) {
        .alphabet-container {
            grid-template-columns: repeat(4, 1fr);
            padding-bottom: 70px;
        }
        .letter-box {
            font-size: 3rem;
        }
        .back-button {
            font-size: 16px;
            padding: 8px 16px;
        }
    }

    @media screen and (max-width: 480px) {
        .alphabet-container {
            grid-template-columns: repeat(3, 1fr);
            padding-bottom: 80px;
        }
        .letter-box {
            font-size: 2.5rem;
        }
        .back-button {
            font-size: 14px;
            padding: 6px 12px;
        }
    }
    </style>
</head>
<body>
    <div class="alphabet-container" id="alphabetBox">
        <!-- The button is still in the bottom-right corner of the alphabet container -->
        <button class="back-button" onclick="window.location.href = 'index.html';">Atpakaļ uz paneli</button>
    </div>

    <script>
        const alphabet = ["A", "Ā", "B", "C", "Č", "D", "E", "Ē", "F", "G", "Ģ", "H", "I", "Ī", "J", "K", "Ķ", "L", "Ļ", "M", "N", "Ņ", "O", "P", "R", "S", "Š", "T", "U", "Ū", "V", "Z", "Ž"];
        const alphabetBox = document.getElementById("alphabetBox");

        alphabet.forEach(letter => {
            const box = document.createElement("div");
            box.classList.add("letter-box");
            box.textContent = letter;

            const popup = document.createElement("div");
            popup.classList.add("popup");
            const img = document.createElement("img");
            img.src = `images/${letter}.png`;
            popup.appendChild(img);

            box.appendChild(popup);

            const audio = document.createElement("audio");
            audio.src = `audio/${letter}.wav`;
            audio.preload = "auto";

            box.appendChild(audio);

            box.addEventListener("mouseenter", () => {
                audio.play();
            });

            box.addEventListener("click", () => {
                if (box.classList.contains("active")) {
                    box.classList.remove("active"); // Close popup
                } else {
                    document.querySelectorAll(".letter-box").forEach(b => b.classList.remove("active"));
                    box.classList.add("active"); // Open popup
                }
            });

            alphabetBox.appendChild(box);
        });
    </script>
</body>
</html>
